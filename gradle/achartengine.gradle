plugins {
    id "com.android.library"
}

android {
    namespace = "org.achartengine"
    compileSdk = 37

    defaultConfig {
        minSdk = 4
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
